name: Aggregate authorized TVBox sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Aggregate approved sources
        run: node scripts/aggregate.mjs
      - name: Commit updated configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yuhuyan.json
          if git diff --cached --quiet; then
            echo "配置没有变化，无需提交"
          else
            git commit -m "自动更新尤湖沿聚合配置"
            git push
          fi
